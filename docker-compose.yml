version: "3.0"
services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    # ports:
    #   - 5123:5432
    env_file:
      - .db.env
    volumes:
      - ../pData:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -t 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
    networks:
      - microservice

  ts-plugin:
    container_name: ts-plugin
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      postfix:
        condition: service_healthy
    networks:
      microservice:
      mail:
        ipv4_address: 172.30.25.2
    environment:
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: postfix
      EMAIL_PORT: 25
    links:
      - db
    volumes:
      - ../logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - microservice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A user_service worker --loglevel=error --concurrency=20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      postfix:
        condition: service_healthy
    volumes:
      - service_logs:/home/ts-app/logs
    networks:
      microservice:
      mail:
        ipv4_address: 172.30.25.3
    environment:
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: postfix
      EMAIL_PORT: 25

  postfix:
    build:
      context: docker/postfix
    restart: always
    environment:
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:?Set POSTFIX_HOSTNAME to the production mail hostname}
    volumes:
      - postfix_queue:/var/spool/postfix
    networks:
      mail:
        ipv4_address: 172.30.25.4
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_beat:
    container_name: celery_beat
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A user_service beat --loglevel=error
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - service_logs:/home/ts-app/logs
    networks:
      - microservice

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    links:
      - ts-plugin
    ports:
      - "0.0.0.0:80:80"
    networks:
      - microservice
      - logger

    volumes:
      - ./staticfiles:/staticfiles

networks:
  microservice:
  logger:
  mail:
    ipam:
      config:
        - subnet: 172.30.25.0/29

volumes:
  service_logs:
  postfix_queue:
