<h1 style="font-size:24px;line-height:1.3;">New note in {{ note.ontology_id }}</h1>
<p>A new note has been added to an ontology you follow.</p>
<h2 style="font-size:20px;overflow-wrap:anywhere;">{{ note.title }}</h2>
<p><strong>Created by:</strong> {{ username }}</p>
{% if note_url %}<p><a href="{{ note_url }}" style="color:#075985;font-weight:bold;">View note</a></p>{% endif %}
<p>You received this email because you follow this ontology and have note notifications enabled.</p>
